<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caesar Groep - Complimentje geven</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js"
        }
      }
    </script>
    <style>
      three-d-stage:not(:defined) {
        visibility: hidden;
      }

      /* Shown the instant the browser parses this markup - before the JS
         bundle has loaded, and before MSAL has finished a silent/redirect
         token refresh - so the page never sits blank white while that
         resolves. Angular clears app-root's light DOM and takes over once
         it bootstraps. */
      .initial-loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #224f82;
      }

      .initial-loading-spinner {
        width: 64px;
        height: 64px;
        border: 6px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: initial-loading-spin 1s linear infinite;
      }

      @keyframes initial-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="initial-loading-screen">
        <div class="initial-loading-spinner"></div>
      </div>
    </app-root>
  </body>
</html>
