<div class="search-screen">
  <h1>Wie wil je een compliment geven?</h1>
  <input
    class="search-input"
    type="text"
    placeholder="Zoek een collega..."
    autocomplete="off"
    spellcheck="false"
    [(ngModel)]="searchTerm"
  />
  <ul class="suggestions">
    @for (recipient of suggestions(); track recipient.id) {
      <li>
        <button
          type="button"
          class="suggestion"
          [class.suggestion--complimented]="recipient.hasCompliment"
          [disabled]="recipient.hasCompliment"
          [title]="recipient.hasCompliment ? 'Deze persoon heeft al een complimentje, laten we er iedereen een complimentje geven' : ''"
          (click)="selectRecipient(recipient)"
        >
          @if (avatarUrls()[recipient.id]) {
            <img class="avatar" [src]="avatarUrls()[recipient.id]" alt="" />
          } @else {
            <span class="avatar avatar-fallback">{{ initials(recipient.name) }}</span>
          }
          <span class="suggestion-text">
            <span class="suggestion-name">{{ recipient.name }}</span>
            <span class="suggestion-jobtitle">{{ recipient.jobTitle }}</span>
          </span>
        </button>
      </li>
    } @empty {
      <li class="no-results">Geen collega's gevonden</li>
    }
  </ul>
</div>
