services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --tableHost 0.0.0.0 --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - '10000:10000' # blob
      - '10001:10001' # queue
      - '10002:10002' # table
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
